<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MX32 Patch Sheet (Beta)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--sf:#fff;--s2:#eef1f5;--tx:#10141b;--mu:#586273;--bd:#d5dae2;--ac:#0a93c4;--ac2:#04141c;--rd:#c8262d;--rdb:#fde8e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-con="X32"]{--ac:#b87800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--sf:#141821;--s2:#1c2230;--tx:#eef1f6;--mu:#97a2b6;--bd:#2b3347;--ac:#19c8ff;--rd:#ff6b70;--rdb:#3a1b1e}:root:not([data-theme="light"])[data-con="X32"]{--ac:#ffb300}}
:root[data-theme="dark"]{--bg:#0b0d12;--sf:#141821;--s2:#1c2230;--tx:#eef1f6;--mu:#97a2b6;--bd:#2b3347;--ac:#19c8ff;--rd:#ff6b70;--rdb:#3a1b1e}
:root[data-theme="dark"][data-con="X32"]{--ac:#ffb300}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Barlow,system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:14px 12px 28px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top img{width:52px;height:52px;flex:none;border-radius:12px}
h1{margin:0;font-size:22px;font-style:italic;font-weight:700;line-height:1.1}
h1 span{font-style:normal;font-weight:500;color:var(--mu);font-size:16px}
.sub{margin:2px 0 0;font-size:13px;color:var(--mu)}
input,select,button{font:inherit;font-size:14px;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:8px;height:36px;padding:0 8px;box-sizing:border-box;min-width:0}
button{cursor:pointer;padding:0 10px}
input[type=text]::placeholder{color:var(--mu)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.fl{display:flex;gap:8px;margin-bottom:8px}.fl>*{flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.tabs{display:flex;gap:4px;margin:6px 0 10px;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;height:40px;color:var(--mu);font-weight:500}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
h2{font-size:15px;font-weight:600;margin:16px 0 4px}h2:first-child{margin-top:0}
.r{padding:5px 0;border-top:1px solid var(--bd)}.r:first-of-type{border-top:0}
.rl{display:flex;align-items:center;gap:6px}
.rl input,.rl select{flex:1;font-size:13px}.rl select{flex:1.2}
.n{width:34px;flex:none!important;padding:0;font-size:12px}
.v{flex:none!important;padding:0 6px;font-size:12px}
.v.on{background:var(--rdb);color:var(--rd);border-color:var(--rd);font-weight:600}
.on.v{background:var(--rdb)}
.nm{min-width:48px;font-size:13px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.g button{padding:0;height:30px;font-size:11px}
.nt{width:100%;margin-top:6px;font-size:12px}
.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600;width:100%;height:42px}
.ghost{width:100%;margin-top:8px}
.soon{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd);color:var(--mu);font-size:14px}
.soon b{font-weight:500;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;white-space:nowrap;align-self:center}
.msg{min-height:20px;font-size:13px;margin:10px 0 0;color:var(--mu)}
.msg.e{color:var(--rd)}
</style></head><body><div class="w">

<script>
var K="mx32beta",VK="mx32venues",T=["Inputs","Outputs","Export"],tab=0,all=false,mem=[],S,tm,LB={o:"ol",b:"bl",m:"ml",x:"xl"};
function p2(n){return n<10?"0"+n:""+n}
function mk(n){var a=[];for(var i=0;i<n;i++)a.push({l:"",s:"",p:0,n:"",o:0,k:-1});return a}
function def(){var d=new Date();return{ev:"",dt:d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),vn:"",con:"",c:mk(32),a:mk(8),f:mk(8),ol:[],os:[],bl:[],ml:[],xl:[]}}
function load(){try{var j=JSON.parse(localStorage.getItem(K)||"null");if(j&&j.c&&j.a&&j.f)return j}catch(e){}return def()}
S=load();
function save(){clearTimeout(tm);tm=setTimeout(function(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},300)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
var CN=["OFF","RD","GN","YE","BL","MG","CY","WH"],CB=["#1a1a1a","#e53935","#43a047","#fdd835","#1e88e5","#c026d3","#00bcd4","#f5f5f5"],CT=["#fff","#fff","#fff","#000","#fff","#fff","#000","#000"];
function cs(i){var j=i%8;if(i<8)return{n:CN[j],b:CB[j],t:CT[j]};if(j==0)return{n:"OFFi",b:"#9e9e9e",t:"#1a1a1a"};if(j==7)return{n:"WHi",b:"#3a3a3a",t:"#f5f5f5"};return{n:CN[j]+"i",b:"#ececec",t:CB[j]}}
function vget(){try{var v=JSON.parse(localStorage.getItem(VK)||"null");if(v)return v}catch(e){}return mem}
function vset(v){mem=v;try{localStorage.setItem(VK,JSON.stringify(v))}catch(e){}}
function vr(){var v=vget(),h='<option value="">Venue</option>';v.forEach(function(x){h+='<option value="'+esc(x)+'"'+(x===S.vn?' selected':'')+'>'+esc(x)+'</option>'});document.getElementById("vs").innerHTML=h+'<option value="__new">+ New venue</option>'}
function setCon(){document.documentElement.setAttribute("data-con",S.con||"")}
var $=function(i){return document.getElementById(i)};
$("ev").value=S.ev;$("dt").value=S.dt;$("cs").value=S.con;vr();setCon();
$("ev").addEventListener("input",function(e){S.ev=e.target.value;save()});
$("dt").addEventListener("change",function(e){S.dt=e.target.value;save()});
$("cs").addEventListener("change",function(e){S.con=e.target.value;setCon();save()});
$("vs").addEventListener("change",function(e){var v=e.target.value;if(v=="__new"){$("nv").style.display="flex";$("vi").focus();return}$("nv").style.display="none";S.vn=v;save()});
$("vb").addEventListener("click",function(){var n=$("vi").value.trim();if(!n)return;var v=vget(),f=null;v.forEach(function(x){if(x.toLowerCase()===n.toLowerCase())f=x});if(!f){v=v.concat([n]);vset(v);f=n}S.vn=f;save();$("vi").value="";$("nv").style.display="none";vr()});
function opts(g,sel){var h='<option value="">Source</option>',i;
if(g=="c"){h+='<optgroup label="Local">';for(i=1;i<=32;i++)h+='<option value="L'+i+'"'+(sel=="L"+i?' selected':'')+'>Local '+i+'</option>';
h+='</optgroup><optgroup label="AES50 A">';for(i=1;i<=48;i++)h+='<option value="A'+i+'"'+(sel=="A"+i?' selected':'')+'>AES A '+i+'</option>';
h+='</optgroup><optgroup label="AES50 B">';for(i=1;i<=48;i++)h+='<option value="B'+i+'"'+(sel=="B"+i?' selected':'')+'>AES B '+i+'</option>';h+='</optgroup>'}
if(g=="a"){for(i=1;i<=6;i++)h+='<option value="X'+i+'"'+(sel=="X"+i?' selected':'')+'>Aux '+i+'</option>';h+='<option value="UL"'+(sel=="UL"?' selected':'')+'>USB L</option><option value="UR"'+(sel=="UR"?' selected':'')+'>USB R</option>'}
if(g=="f"){for(i=1;i<=8;i++)h+='<option value="F'+i+'"'+(sel=="F"+i?' selected':'')+'>FX slot '+i+'</option>'}
return h}
function bopts(sel){var h='<option value="">Bus</option><optgroup label="Mix buses">',i,t;
for(i=1;i<=16;i++){t=S.bl[i-1]?" · "+S.bl[i-1].slice(0,8):"";h+='<option value="B'+i+'"'+(sel=="B"+i?' selected':'')+'>Bus '+i+esc(t)+'</option>'}
h+='</optgroup><optgroup label="Main"><option value="ML"'+(sel=="ML"?' selected':'')+'>Main L</option><option value="MR"'+(sel=="MR"?' selected':'')+'>Main R</option><option value="MC"'+(sel=="MC"?' selected':'')+'>Mono</option></optgroup><optgroup label="Matrix">';
for(i=1;i<=6;i++)h+='<option value="X'+i+'"'+(sel=="X"+i?' selected':'')+'>Matrix '+i+'</option>';return h+'</optgroup>'}
function row(g,k){var c=S[g][k],st="";if(c.k>=0){var s=cs(c.k);st=' style="background:'+s.b+';color:'+s.t+';border-color:'+s.b+'"'}var h="";
if(c.o){h='<div class="g">';for(var i=0;i<16;i++){var q=cs(i);h+='<button data-k="'+g+'|'+k+'|'+i+'" aria-label="Colour '+q.n+'" style="background:'+q.b+';color:'+q.t+';'+(c.k==i?'outline:2px solid var(--tx);outline-offset:1px':'')+'">'+q.n+'</button>'}
h+='</div><input type="text" class="nt" data-c="'+g+'|n|'+k+'" value="'+esc(c.n)+'" placeholder="Notes" aria-label="Notes">'}
return '<div class="r"><div class="rl"><button class="n" data-n="'+g+'|'+k+'"'+st+' aria-label="Colour and notes for '+(k+1)+'">'+(k+1)+(c.n?'•':'')+'</button><input type="text" data-c="'+g+'|l|'+k+'" value="'+esc(c.l)+'" placeholder="Label" aria-label="Label"><select data-c="'+g+'|s|'+k+'" aria-label="Source">'+opts(g,c.s)+'</select>'+(g=="c"?'<button class="v'+(c.p?' on':'')+'" data-p="'+k+'" aria-label="Phantom power">48V</button>':'')+'</div>'+h+'</div>'}
function orow(g,k,name){return '<div class="r"><div class="rl"><span class="nm">'+name+'</span><input type="text" data-o="'+g+'|'+k+'" value="'+esc(S[LB[g]][k]||"")+'" placeholder="Label" aria-label="'+name+' label"></div></div>'}
function oout(k){return '<div class="r"><div class="rl"><span class="nm">Out '+(k+1)+'</span><input type="text" data-o="o|'+k+'" value="'+esc(S.ol[k]||"")+'" placeholder="Label" aria-label="Output '+(k+1)+' label"><select data-os="'+k+'" aria-label="Output '+(k+1)+' bus">'+bopts(S.os[k]||"")+'</select></div></div>'}
function used(c){return c.l||c.s||c.n||c.k>=0||c.p}
function render(){var v=$("view"),h="",k,N=all?32:8;
if(tab==0){h+='<h2>Channels 1 to 32</h2>';for(k=0;k<N;k++)h+=row("c",k);h+='<button class="ghost" data-all="1">'+(all?'Show first 8 channels':'Show all 32 channels')+'</button><h2>Aux in 1 to 8</h2>';for(k=0;k<8;k++)h+=row("a",k);h+='<h2>FX returns 1 to 8</h2>';for(k=0;k<8;k++)h+=row("f",k)}
if(tab==1){h+='<h2>Outputs 1 to 16</h2>';for(k=0;k<16;k++)h+=oout(k);h+='<h2>Mix buses 1 to 16</h2>';for(k=0;k<16;k++)h+=orow("b",k,"Bus "+(k+1));h+='<h2>Main</h2>'+orow("m",0,"Main L")+orow("m",1,"Main R")+orow("m",2,"Mono")+'<h2>Matrix 1 to 6</h2>';for(k=0;k<6;k++)h+=orow("x",k,"Matrix "+(k+1))}
if(tab==2){var n=S.c.filter(used).length+S.a.filter(used).length+S.f.filter(used).length;
h='<h2>Save your patch list</h2><p class="sub" style="margin:0 0 10px">'+n+' of 48 inputs filled in. Your work is saved on this device as you type.</p><button class="pri" data-x="1">Save patch list (CSV)</button><p class="msg" id="msg" role="status"></p><div class="soon"><span>Scene file for the console (.scn)</span><b>Coming soon</b></div><div class="soon"><span>Patch sheet as PDF</span><b>Coming soon</b></div><button class="ghost" data-new="1" style="margin-top:14px">Start a new event</button>'}
v.innerHTML=h;document.querySelectorAll("#tabs button").forEach(function(b,i){b.className=i==tab?"on":""})}
$("tabs").innerHTML=T.map(function(t,i){return '<button data-t="'+i+'">'+t+'</button>'}).join("");
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){tab=+b.getAttribute("data-t");render();window.scrollTo(0,0)}});
var vw=$("view");
function upd(e){var t=e.target,o=t.getAttribute("data-o");if(o){var p=o.split("|");S[LB[p[0]]][p[1]]=t.value;save();return}
var s=t.getAttribute("data-os");if(s!==null){S.os[s]=t.value;save();return}
var c=t.getAttribute("data-c");if(c){var q=c.split("|");S[q[0]][q[2]][q[1]]=t.value;save()}}
vw.addEventListener("input",upd);vw.addEventListener("change",upd);
function sname(g,s){if(!s)return"";var t=s.charAt(0),n=s.slice(1);if(g=="c")return t=="L"?"Local "+n:t=="A"?"AES50 A "+n:"AES50 B "+n;if(g=="a")return s=="UL"?"USB L":s=="UR"?"USB R":"Aux "+n;return"FX slot "+n}
function bname(s){if(!s)return"";if(s=="ML")return"Main L";if(s=="MR")return"Main R";if(s=="MC")return"Mono";return(s.charAt(0)=="B"?"Bus ":"Matrix ")+s.slice(1)}
function q(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(){var r=[["Event",S.ev],["Date",S.dt],["Venue",S.vn],["Console",S.con==="M32"?"Midas M32":"Behringer X32"],[],["Section","No","Label","Source or bus","48V","Colour","Notes"]];
[["c","Input channel"],["a","Aux in"],["f","FX return"]].forEach(function(z){S[z[0]].forEach(function(c,i){if(used(c))r.push([z[1],i+1,c.l,sname(z[0],c.s),z[0]=="c"?(c.p?"On":"Off"):"",c.k>=0?cs(c.k).n:"",c.n])})});
for(var i=0;i<16;i++)if(S.ol[i]||S.os[i])r.push(["Output",i+1,S.ol[i]||"",bname(S.os[i]),"","",""]);
for(i=0;i<16;i++)if(S.bl[i])r.push(["Mix bus",i+1,S.bl[i],"","","",""]);
["Main L","Main R","Mono"].forEach(function(n,i){if(S.ml[i])r.push(["Main",n,S.ml[i],"","","",""])});
for(i=0;i<6;i++)if(S.xl[i])r.push(["Matrix",i+1,S.xl[i],"","","",""]);
return"\ufeff"+r.map(function(x){return x.map(q).join(",")}).join("\r\n")}
function say(t,e){var m=$("msg");if(m){m.textContent=t;m.className="msg"+(e?" e":"")}}
var nt=0;
vw.addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;
if(b.getAttribute("data-all")){all=!all;render();return}
var kk=b.getAttribute("data-k");if(kk){var z=kk.split("|"),r=S[z[0]][z[1]];r.k=r.k==+z[2]?-1:+z[2];save();render();return}
var n=b.getAttribute("data-n");if(n){var y=n.split("|"),c=S[y[0]][y[1]];c.o=c.o?0:1;render();return}
var p=b.getAttribute("data-p");if(p!==null){var d=S.c[p];d.p=d.p?0:1;b.className="v"+(d.p?" on":"");save();return}
if(b.getAttribute("data-new")){if(!nt){nt=1;b.textContent="Tap again to clear everything";setTimeout(function(){nt=0;if(b.isConnected)b.textContent="Start a new event"},4000);return}
var keep=S.con;S=def();S.con=keep;save();nt=0;$("ev").value="";$("dt").value=S.dt;$("vs").value="";setCon();all=false;render();return}
if(b.getAttribute("data-x")){if(!S.con){say("Choose a console at the top first.",1);return}
var dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(x){}
var nm=(S.ev||"event").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"event";
var fn="MX32-patch-list-"+nm+"-"+S.dt+".csv";
if(!dl){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv()],{type:"text/csv"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();say("Saved to your downloads. Open the CSV in Excel, Numbers or Google Sheets.");return}
try{await dl.save({filename:"MX32-patch-list-"+nm+"-"+S.dt+".csv",data:csv()});say("Saved. Open the CSV in Excel, Numbers or Google Sheets.")}catch(x){say(x&&x.code=="declined"?"Save cancelled.":"Couldn’t save the file. Try again.",1)}}});
render();
</script></body></html>
